name: E-Commerce Test Automation CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run UI, API & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium browser and OS dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Upload HTML Reports and Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-report-and-traces
          path: |
            reports/
            test-results/
          retention-days: 14
