[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --html=reports/report.html
    --self-contained-html
    --base-url=https://practicesoftwaretesting.com

markers =
    ui: Playwright web user interface tests
    api: Backend REST API tests using Requests
    integration: Combined UI and API end-to-end integration tests
    smoke: Smoke tests for critical user journeys and health checks
    regression: Comprehensive regression tests across all features
